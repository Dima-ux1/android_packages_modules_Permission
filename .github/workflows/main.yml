name: Build PermissionController APEX (A16)

on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache prebuilts
        id: prebuilts-cache
        uses: actions/cache@v4
        with:
          path: ~/prebuilts
          key: prebuilts-ubuntu-v2

      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y git zip unzip

      - name: Fetch build-tools + build (once)
        if: steps.prebuilts-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/prebuilts
          cd ~/prebuilts
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/build-tools build-tools
          git clone --depth 1 https://android.googlesource.com/platform/build build

      - name: Locate soong_ui and make it executable
        run: |
          find ~/prebuilts -name soong_ui -type f -exec chmod +x {} \;
          SOONG_UI=$(find ~/prebuilts -name soong_ui -type f | head -n1)
          [[ -n "$SOONG_UI" ]] || { echo "❌ soong_ui not found"; exit 1; }
          echo "✅ Found: $SOONG_UI"
          echo "SOONG_UI=$SOONG_UI" >> $GITHUB_ENV

      - name: Clone minimal build/ into repo root
        run: |
          [[ -d build ]] || cp -r ~/prebuilts/build build

      - name: Build APEX
        run: |
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          export PATH="$(dirname $SOONG_UI):$PATH"
          cd $TOP
          soong_ui --make-mode com.android.permissioncontroller.apex -j$(nproc)

      - name: Upload APEX
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-A16
          path: out/soong/apex/com.android.permissioncontroller.apex
