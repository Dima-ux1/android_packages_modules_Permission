name: Build PermissionController APEX (A16)

on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. исходники модуля
      - uses: actions/checkout@v4

      # 2. JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. кэш prebuilts (чтобы не тянуть каждый раз)
      - uses: actions/cache@v4
        id: prebuilts-cache
        with:
          path: ~/prebuilts
          key: prebuilts-ubuntu-latest-v1

      # 4. минимальные зависимости
      - run: sudo apt-get update -qq && sudo apt-get install -y git zip unzip

      # 5. качаем build-tools и build (только первый раз)
      - name: Fetch build essentials
        if: steps.prebuilts-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/prebuilts
          cd ~/prebuilts
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/build-tools build-tools
          git clone --depth 1 https://android.googlesource.com/platform/build              build

      # 6. собираем
      - name: Build com.android.permissioncontroller.apex
        run: |
          set -euo pipefail
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          BUILDTOOLS=~/prebuilts/build-tools

          # кладём soong_ui в PATH
          export PATH="$BUILDTOOLS/linux-x86:$PATH"

          # копируем нужный минимальный build/ в корень
          [[ -d build ]] || cp -r ~/prebuilts/build build

          # собираем
          cd $TOP
          soong_ui --make-mode com.android.permissioncontroller.apex -j$(nproc)

      # 7. выкладываем
      - uses: actions/upload-artifact@v4
        with:
          name: PermissionController-A16-apex
          path: out/soong/apex/com.android.permissioncontroller.apex
