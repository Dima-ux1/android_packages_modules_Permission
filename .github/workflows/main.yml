name: Build PermissionController APEX (A16)
on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y git zip unzip curl

      - name: Clone build stack + starlark-go
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/build          build
          git clone --depth 1 https://android.googlesource.com/platform/build/soong      soong
          git clone --depth 1 https://android.googlesource.com/platform/build/blueprint   blueprint
          git clone --depth 1 https://android.googlesource.com/platform/external/starlark-go external/starlark-go

      - name: Patch go.mod (starlark & blueprint only)
        run: |
          cd soong
          rm -f go.work go.work.sum
          go mod edit -replace github.com/google/blueprint=../blueprint
          go mod edit -replace go.starlark.net=../external/starlark-go
          go mod tidy
          go mod download

      - name: Bootstrap soong_ui
        run: |
          cd soong
          BLUEPRINTDIR=$PWD/../blueprint \
          BOOTSTRAP=$PWD/../blueprint/bootstrap.bash \
          ./bootstrap.bash
          mkdir -p out/host/linux-x86/bin
          cp out/soong_ui out/host/linux-x86/bin/soong_ui
          chmod +x out/host/linux-x86/bin/soong_ui
          echo "SOONG_UI=$PWD/out/soong_ui" >> $GITHUB_ENV

      - name: Build com.android.permissioncontroller.apex
        run: |
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          mkdir -p "$OUT"
          "$SOONG_UI" --make-mode com.android.permissioncontroller.apex -j$(nproc)

      - name: Upload APEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-A16
          path: out/soong/apex/com.android.permissioncontroller.apex
