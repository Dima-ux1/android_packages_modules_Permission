name: Build crDroid PermissionController APEX

# запускаем вручную или при пуше в указанные ветки
on:
  workflow_dispatch:
  push:
    branches: [14.0, 13.0, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache prebuilts
        id: prebuilts
        uses: actions/cache@v4
        with:
          path: ~/prebuilts
          key: prebuilts-${{ runner.os }}-v2

      - name: Install minimal AOSP deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core zip curl unzip

      - name: Clone Android build-tools (soong + prebuilts)
        if: steps.prebuilts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/prebuilts
          cd ~/prebuilts
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/build-tools build-tools
          git clone --depth 1 https://android.googlesource.com/platform/build/soong           soong

      # =====  собственно сборка (без -e)  =====
      - name: Build single APEX module
        shell: bash          # важно: без флага -e
        run: |
          # 1. кладём утилиты в PATH
          export PATH="$HOME/prebuilts/build-tools/linux-x86/bin:$PATH"
          command -v soong_ui || { echo "soong_ui not found"; exit 1; }

          # 2. экспортируем переменные окружения AOSP
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out

          # 3. отключаем авто-выход, чтобы внутренний exit 1 не убивал job
          set +e
          set -o pipefail

          # 4. собираем
          soong_ui --make-mode com.android.permissioncontroller.apex -j$(nproc)
          build_result=$?

          # 5. проверяем, действительно ли появился артефакт
          apex_file="$OUT/soong/apex/com.android.permissioncontroller.apex"
          if [[ -f "$apex_file" ]]; then
            echo "✅  APEX собрался:"
            ls -lh "$apex_file"
          else
            echo "❌  APEX НЕ создался (soong_ui вернул $build_result)"
            exit $build_result     # делаем job красным по-настоящему
          fi

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-crDroid
          path: out/soong/apex/com.android.permissioncontroller.apex
