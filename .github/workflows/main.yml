name: Build PermissionController APEX (A16)
on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y git zip unzip curl

      - name: Clone build/soong + sub-modules
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/build          build
          git clone --depth 1 https://android.googlesource.com/platform/build/soong      soong
          git clone --depth 1 https://android.googlesource.com/platform/build/blueprint  blueprint
          git clone --depth 1 https://android.googlesource.com/platform/external/go-cmp        external/go-cmp
          git clone --depth 1 https://android.googlesource.com/platform/external/golang-protobuf external/golang-protobuf
          git clone --depth 1 https://android.googlesource.com/platform/external/starlark-go     external/starlark-go

      - name: Build soong_ui
        run: |
          cd soong/cmd/soong_ui
          go build -o /tmp/soong_ui .
          chmod +x /tmp/soong_ui
          echo "SOONG_UI=/tmp/soong_ui" >> $GITHUB_ENV

      - name: Build APEX
        run: |
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          mkdir -p $OUT
          $SOONG_UI --make-mode com.android.permissioncontroller.apex -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-A16
          path: out/soong/apex/com.android.permissioncontroller.apex
