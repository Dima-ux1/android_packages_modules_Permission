name: Build PermissionController APEX (A16)
on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y git zip unzip curl

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download prebuilt soong_ui
        run: |
          mkdir -p ~/soong/bin
          curl -L -o ~/soong/bin/soong_ui \
            https://github.com/akhilnarang/soong-ui/releases/download/2024-09/soong_ui
          chmod +x ~/soong/bin/soong_ui
          echo "SOONG_UI=$HOME/soong/bin/soong_ui" >> $GITHUB_ENV

      - name: Clone minimal build/
        run: git clone --depth 1 https://android.googlesource.com/platform/build build

      - name: Patch Android.bp for standalone build
        run: |
          # убираем зависимости от всего дерева
          sed -i '/build[/][/]soong[/]/build[/][/]go[/]/blueprint/d' Android.bp || true
          sed -i '/prebuilt[/][/]etc/d' Android.bp || true

      - name: Build APEX
        run: |
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          mkdir -p $OUT
          $SOONG_UI --make-mode com.android.permissioncontroller.apex -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-A16
          path: out/soong/apex/com.android.permissioncontroller.apex
