  - name: Build single APEX module
    shell: bash          # GitHub перестаёт ставить -e
    run: |
      # 1. кладём утилиты в PATH
      export PATH="$HOME/prebuilts/build-tools/linux-x86/bin:$PATH"
      command -v soong_ui || { echo "soong_ui not found"; exit 1; }

      # 2. экспортируем переменные окружения AOSP
      export TOP=$GITHUB_WORKSPACE
      export OUT=$TOP/out

      # 3. отключаем авто-выход, чтобы внутренний «exit 1» не убивал job
      set +e
      set -o pipefail

      # 4. собираем
      soong_ui --make-mode com.android.permissioncontroller.apex -j$(nproc)
      build_result=$?

      # 5. проверяем, действительно ли появился артефакт
      apex_file="$OUT/soong/apex/com.android.permissioncontroller.apex"
      if [[ -f "$apex_file" ]]; then
        echo "✅  APEX собрался:"
        ls -lh "$apex_file"
      else
        echo "❌  APEX НЕ создался (soong_ui вернул $build_result)"
        exit $build_result     # делаем job красным по-настоящему
      fi
