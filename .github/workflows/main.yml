name: Build crDroid PermissionController APEX
on:
  workflow_dispatch:
  push:
    branches: [ 16.0 ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache prebuilts
        id: prebuilts
        uses: actions/cache@v4
        with:
          path: ~/prebuilts
          key: prebuilts-${{ runner.os }}-v2

      - name: Install minimal AOSP deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core zip curl unzip

      - name: Clone Android build-tools (soong + prebuilts)
        if: steps.prebuilts.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/prebuilts
          cd ~/prebuilts
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/build-tools build-tools
          git clone --depth 1 https://android.googlesource.com/platform/build/soong           soong

      - name: Clone minimal build/ tree
        run: |
          # soong_ui требует Android.bp/Android.mk в корне
          if [[ ! -d $GITHUB_WORKSPACE/build ]]; then
            git clone --depth 1 https://android.googlesource.com/platform/build $GITHUB_WORKSPACE/build
          fi

      - name: Build single APEX module
        shell: bash
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          export TOP=$GITHUB_WORKSPACE
          export OUT=$TOP/out
          BUILDTOOLS="$HOME/prebuilts/build-tools"

          [[ -f $BUILDTOOLS/linux-x86/soong_ui ]] \
            || { echo "❌  soong_ui not found"; exit 1; }

          export PATH="$BUILDTOOLS/linux-x86:$PATH"
          soong_ui --make-mode com.android.permissioncontroller.apex -j$(nproc)

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionController-crDroid
          path: out/soong/apex/com.android.permissioncontroller.apex
